name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build profile broadsheet SVG
        run: node .github/scripts/build-activity-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_FILE: dist/stats/activity-card.svg

      - name: Commit updated profile graphic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg assets/profile-dark.svg assets/profile-light.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stats): refresh profile graphics [skip ci]" && git push origin main)

      # single deploy: ghaction-github-pages force-pushes build_dir as the
      # branch root, so everything on output must come from this one dist
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
