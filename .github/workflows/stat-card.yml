name: Generate Activity Card

on:
  schedule:
    # offset from the snake workflow (0 */6) to avoid simultaneous pushes to output
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build activity card SVG
        run: node .github/scripts/build-activity-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          destination_dir: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
