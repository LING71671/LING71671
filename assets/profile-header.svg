<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ling — All in the game</title>
  <desc id="desc">A dark workspace-style profile banner with a terminal motif.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.55" stop-color="#101827" />
      <stop offset="1" stop-color="#171126" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" />
      <stop offset="0.52" stop-color="#a371f7" />
      <stop offset="1" stop-color="#f778ba" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#58a6ff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)" />
  <rect width="1200" height="320" rx="26" fill="url(#grid)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="24.5" fill="none" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="3" />

  <circle cx="1030" cy="42" r="150" fill="#a371f7" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="1130" cy="290" r="180" fill="#58a6ff" fill-opacity="0.07" filter="url(#glow)" />

  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace">
    <text x="72" y="62" fill="#8b949e" font-size="17" letter-spacing="3">LING  //  PERSONAL WORKSPACE</text>
    <text x="68" y="160" fill="url(#accent)" font-size="92" font-weight="700" letter-spacing="8" filter="url(#glow)">LING</text>
    <text x="72" y="206" fill="#f0f6fc" font-size="24" letter-spacing="7">ALL IN THE GAME</text>

    <g font-size="15" letter-spacing="1.5">
      <rect x="72" y="246" width="92" height="34" rx="17" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65" />
      <text x="91" y="268" fill="#79c0ff">TOOLS</text>
      <rect x="178" y="246" width="138" height="34" rx="17" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.65" />
      <text x="196" y="268" fill="#d2a8ff">EXPERIMENTS</text>
      <rect x="330" y="246" width="112" height="34" rx="17" fill="#f778ba" fill-opacity="0.1" stroke="#f778ba" stroke-opacity="0.65" />
      <text x="351" y="268" fill="#ff9bce">SYSTEMS</text>
      <rect x="456" y="246" width="126" height="34" rx="17" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.65" />
      <text x="475" y="268" fill="#7ee787">ODD IDEAS</text>
    </g>

    <g transform="translate(760 58)">
      <rect width="356" height="202" rx="14" fill="#090c10" fill-opacity="0.82" stroke="#30363d" stroke-width="2" />
      <rect width="356" height="38" rx="14" fill="#161b22" />
      <path d="M0 38H356" stroke="#30363d" />
      <circle cx="22" cy="19" r="5" fill="#f85149" />
      <circle cx="40" cy="19" r="5" fill="#d29922" />
      <circle cx="58" cy="19" r="5" fill="#3fb950" />
      <text x="80" y="25" fill="#8b949e" font-size="13">workspace://ling/profile</text>

      <text x="24" y="76" fill="#7ee787" font-size="16">&gt;</text>
      <text x="48" y="76" fill="#c9d1d9" font-size="16">whoami</text>
      <text x="24" y="108" fill="#79c0ff" font-size="16">ling</text>
      <text x="24" y="142" fill="#7ee787" font-size="16">&gt;</text>
      <text x="48" y="142" fill="#c9d1d9" font-size="16">status</text>
      <text x="24" y="174" fill="#d2a8ff" font-size="16">building something...</text>
      <rect x="224" y="160" width="9" height="17" fill="#d2a8ff" />
    </g>
  </g>
</svg>
