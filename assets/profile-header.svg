<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ling personal workspace</title>
  <desc id="desc">A lively dark workspace banner with tangerine typography, golden warmth, teal details, and a bilingual contact terminal.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#202628" stroke-width="1" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#111416" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <path d="M842 0H1200V320H978Z" fill="#17302B" />
    <circle cx="1112" cy="42" r="142" fill="#243A34" />
    <path d="M1020 0H1200V184Z" fill="#4A2B1B" />
    <circle cx="1136" cy="22" r="54" fill="#F4C95D" />
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#5E4638" stroke-width="2" />

  <g font-family="Trebuchet MS, Arial, sans-serif">
    <text x="72" y="62" fill="#B9C4BF" font-family="Segoe UI, 'Microsoft YaHei', Arial, sans-serif" font-size="18">Ling · personal workspace / 个人工作台</text>
    <text x="66" y="160" fill="#FF8A4C" font-size="96" font-weight="800" letter-spacing="1">LING</text>
    <path d="M72 180H388" stroke="#F4C95D" stroke-width="6" stroke-linecap="round" />
    <text x="72" y="222" fill="#FFF4E6" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic">All in the game, all in game.</text>
    <text x="72" y="272" fill="#8FD7C5" font-size="16">tools  ·  experiments  ·  systems  ·  odd ideas</text>
  </g>

  <g transform="translate(744 54)">
    <rect width="382" height="214" rx="12" fill="#1B2021" stroke="#3B7C70" stroke-width="2" />
    <path d="M12 0H370A12 12 0 0 1 382 12V40H0V12A12 12 0 0 1 12 0Z" fill="#252B2B" />
    <path d="M0 40H382" stroke="#3B7C70" />
    <circle cx="22" cy="20" r="5" fill="#FF8A4C" />
    <circle cx="40" cy="20" r="5" fill="#F4C95D" />
    <circle cx="58" cy="20" r="5" fill="#4FC1A8" />
    <text x="80" y="25" fill="#B9C4BF" font-family="Consolas, Menlo, monospace" font-size="13">hello@ling</text>

    <g font-family="Consolas, 'Microsoft YaHei', Menlo, monospace" font-size="16">
      <text x="24" y="76" fill="#4FC1A8">&gt;</text>
      <text x="48" y="76" fill="#FFF4E6">status</text>
      <text x="24" y="106" fill="#FF8A4C">open to ideas &amp; collaboration</text>
      <text x="24" y="134" fill="#FFF4E6" font-family="Segoe UI, 'Microsoft YaHei', sans-serif">欢迎交流与合作</text>
      <text x="24" y="168" fill="#4FC1A8">&gt;</text>
      <text x="48" y="168" fill="#FFF4E6">contact</text>
      <text x="24" y="198" fill="#F4C95D">lingmoumou53@gmail.com</text>
      <rect x="244" y="184" width="8" height="17" fill="#4FC1A8" />
