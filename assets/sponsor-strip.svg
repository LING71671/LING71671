<svg xmlns="http://www.w3.org/2000/svg" width="880" height="50" viewBox="0 0 880 50" role="img" aria-labelledby="title desc">
  <title id="title">Supported by Sentry</title>
  <desc id="desc">Supported by Sentry and community sponsors. 感谢 Sentry 与所有赞助支持。</desc>

  <defs>
    <clipPath id="frame">
      <rect width="880" height="50" rx="3" />
    </clipPath>
  </defs>

  <!-- Physical Newsprint Surface -->
  <g clip-path="url(#frame)">
    <rect width="880" height="50" fill="#F4F1EA" />
    <rect width="880" height="50" fill="#000000" fill-opacity="0.015" />
  </g>

  <!-- Newspaper Delicate Hairline Borders -->
  <rect x="0.5" y="0.5" width="879" height="49" rx="2.5" fill="none" stroke="#D5CFC2" stroke-width="1" />
  <rect x="4" y="4" width="872" height="42" rx="1.5" fill="none" stroke="#E6E0D4" stroke-width="0.75" />

  <!-- Sentry Logo in deep printer's ink -->
  <g transform="translate(24, 13) scale(1.02)">
    <path fill="#111215" d="M13.91 2.505c-.873-1.448-2.972-1.448-3.844 0L6.904 7.92a15.478 15.478 0 0 1 8.53 12.811h-2.221A13.301 13.301 0 0 0 5.784 9.814l-2.926 5.06a7.65 7.65 0 0 1 4.435 5.848H2.194a.365.365 0 0 1-.298-.534l1.413-2.402a5.16 5.16 0 0 0-1.614-.913L.296 19.275a2.182 2.182 0 0 0 .812 2.999 2.24 2.24 0 0 0 1.086.288h6.983a9.322 9.322 0 0 0-3.845-8.318l1.11-1.922a11.47 11.47 0 0 1 4.95 10.24h5.915a17.242 17.242 0 0 0-7.885-15.28l2.244-3.845a.37.37 0 0 1 .504-.13c.255.14 9.75 16.708 9.928 16.9a.365.365 0 0 1-.327.543h-2.287c.029.612.029 1.223 0 1.831h2.297a2.206 2.206 0 0 0 1.922-3.31z"/>
  </g>

  <!-- Sentry Wordmark in Thin Serif -->
  <text x="62" y="30.5" fill="#111215" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="15" letter-spacing="2">SENTRY</text>

  <!-- Hairline Divider -->
  <path d="M148 13v24" stroke="#D5CFC2" stroke-width="0.75" />

  <!-- Colophon Credit (Thin, Elegant) -->
  <text x="166" y="30.5" fill="#666158" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="10.5" letter-spacing="1.2">COLOPHON · PROUDLY SUPPORTED BY SENTRY &amp; COMMUNITY PATRONS</text>
</svg>
